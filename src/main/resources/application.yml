spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/musique}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  spotify:
    client-id: ${APP_SPOTIFY_CLIENT_ID:}
    client-secret: ${APP_SPOTIFY_CLIENT_SECRET:}
    accounts-base-url: ${APP_SPOTIFY_ACCOUNTS_BASE_URL:https://accounts.spotify.com}
    api-base-url: ${APP_SPOTIFY_API_BASE_URL:https://api.spotify.com}
